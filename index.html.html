<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鬼電話">
<meta name="theme-color" content="#120a0b">
<title>鬼からの電話</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
*{-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one phone-call screen, three states (setup → ringing → in call). Single dark look by choice. */
:root{
  --bg:#120a0b; --panel:#1e1214; --line:#3a2427; --fg:#f3e9e6; --muted:#a8908c;
  --oni:#c8322b; --ember:#ff7a3d; --ok:#2fa866; --ng:#d63a3a;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center}
.phone{width:100%;max-width:420px;min-height:100%;display:flex;flex-direction:column;padding-block:20px;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;line-height:1.6}
label{display:block;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;box-sizing:border-box;background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:10px;padding:12px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.field{display:flex;flex-direction:column}
.form{display:flex;flex-direction:column;gap:14px}
.btn{border:0;border-radius:999px;padding:14px 20px;font:700 16px var(--body);cursor:pointer;color:#fff;background:var(--oni)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted);line-height:1.6}

/* face */
.face{width:min(240px,62vw);aspect-ratio:3/4;max-width:100%;margin:0 auto;position:relative;border-radius:18px;overflow:hidden;
  box-shadow:0 0 0 2px #5a1f22,0 0 40px rgba(200,50,43,.35);transition:box-shadow .3s}
.face img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.1) saturate(1.15)}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,transparent 30%,rgba(120,0,0,.65));opacity:.5;pointer-events:none}
.ringing .face{animation:shake .35s infinite}
.speaking .face{animation:loom 1.6s ease-in-out infinite;box-shadow:0 0 0 2px #c8322b,0 0 70px rgba(255,40,30,.7)}
.speaking .flash{animation:pulse .5s infinite alternate}
.speaking .face img{animation:jitter .12s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.02)}75%{transform:rotate(4deg) scale(1.02)}}
@keyframes loom{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes pulse{from{opacity:.35}to{opacity:.9}}
@keyframes jitter{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}
body.dark-flash{animation:bgflash .6s}
@keyframes bgflash{0%{background:#5a0000}100%{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){.ringing .face,.speaking .face,.speaking .flash,.speaking .face img{animation:none}}

.caller{text-align:center}
.caller .name{font-family:var(--display);font-size:34px;letter-spacing:.1em}
.caller .meta{color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.callbtns{display:flex;justify-content:space-around;margin-top:auto;padding-bottom:8px}
.round{width:72px;height:72px;border-radius:50%;border:0;color:#fff;font:700 13px var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center}
.round.ok{background:var(--ok)}.round.ng{background:var(--ng)}
.capwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.capwrap span{font-size:12px;color:var(--muted)}

.log{flex:1;min-height:120px;max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;line-height:1.6;white-space:pre-wrap}
.msg.oni{background:#3a1416;align-self:flex-start;border:1px solid #5a1f22}
.msg.me{background:#2a2d33;align-self:flex-end}
.msg.sys{align-self:center;color:var(--muted);font-size:12px;background:none;padding:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.say{display:flex;gap:8px}
.say input{flex:1;min-width:0}
.say .btn{padding:12px 16px}
.endrow{display:flex;justify-content:center}
.microw{display:flex;flex-direction:column;align-items:center;gap:6px}
.mic{width:84px;height:84px;border-radius:50%;border:2px solid var(--oni);background:var(--panel);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic.on{background:var(--oni);animation:micpulse 1s infinite}
.mic:disabled{opacity:.4}
#micStatus{font-size:13px;color:var(--muted);min-height:1.4em;text-align:center}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(200,50,43,.7)}100%{box-shadow:0 0 0 18px rgba(200,50,43,0)}}
</style>
</head><body>

<div class="phone" id="app">

  <!-- setup -->
  <section id="setup" class="form">
    <div>
      <h1>鬼からの電話</h1>
      <p class="sub">名前と理由を入れて「かけてもらう」を押すと、鬼から電話がかかってきます。子どもはマイクで鬼と話せます。</p>
    </div>
    <div class="field"><label for="kid">子どもの名前</label><input id="kid" value="たろう" autocomplete="off"></div>
    <div class="field"><label for="reason">電話の理由</label>
      <select id="reason">
        <option>おもちゃを片付けない</option>
        <option>歯みがきをしない</option>
        <option>夜なかなか寝ない</option>
        <option>ごはんを残す</option>
        <option>きょうだいげんか</option>
        <option>宿題をやらない</option>
        <option value="__other">その他（自由に入力）</option>
      </select>
    </div>
    <div class="field" id="otherWrap" hidden><label for="other">理由を入力</label><input id="other" placeholder="例：ゲームをやめない"></div>
    <div class="field"><label for="scare">こわさ</label>
      <select id="scare">
        <option value="1">こわい</option>
        <option value="2" selected>かなりこわい</option>
        <option value="3">めちゃくちゃこわい</option>
      </select>
    </div>
    <div class="field"><label for="mode">電話のかけかた</label>
      <select id="mode"><option value="in">鬼からかかってくる</option><option value="out">こっちから鬼にかける</option></select>
    </div>
    <div class="field" id="delayWrap"><label for="delay">かかってくるまで</label>
      <select id="delay"><option value="0">すぐ</option><option value="5" selected>5秒後</option><option value="15">15秒後</option></select>
    </div>
    <details class="field" id="apiBox">
      <summary style="cursor:pointer;color:var(--muted);font-size:13px">AIの設定（Gemini APIキー）</summary>
      <div class="form" style="margin-top:10px">
        <div class="field"><label for="apikey">APIキー（この端末にだけ保存）</label><input id="apikey" type="password" autocomplete="off" placeholder="AIza..."></div>
        <div class="field"><label for="model">モデル</label><input id="model" value="gemini-3.8-flash" autocomplete="off"></div>
        <p class="note">キーが空のときは、決まったセリフで話します。</p>
      </div>
    </details>
    <div class="field" style="flex-direction:row;align-items:center;gap:10px">
      <input id="autoListen" type="checkbox" checked style="width:22px;height:22px">
      <label for="autoListen" style="margin:0;font-size:14px;letter-spacing:0;color:var(--fg)">鬼が話し終わったら自動でマイクをオンにする</label>
    </div>
    <button class="btn" id="start">かけてもらう</button>
    <p class="note">音が出ます。iPhoneは本体横のスイッチでマナーモードを解除し、音量を上げてください（マナーモードだと音が出ません）。声の低さは端末の読み上げ機能によって変わります。</p>
  </section>

  <!-- ringing / call -->
  <section id="call" hidden style="display:flex;flex-direction:column;gap:16px;flex:1">
    <div class="face" id="face">
      <img id="oniImg" alt="鬼" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAPOAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDiIHBOCo/KrRRcfdX8qzII5lAZgcVfjdiMEV4Vem4vQ/TsDjIVoavUNi/3R+VG1f7o/KlyM4704riue7R3qz2G7V/ur+VG1f7q/lTqUA0rlWGhV/uj8qXav90flS4pdpouHKM2r/dH5Uu1f7q/lTtpo2mncOUbtX+6PypNq/3V/Kn7TRii4co0Ko/hH5UFVP8ACPyoIoUc0AHlqf4R+VHlL/dH5U/BppajUdkg8tR/CPypGCD+FfyprzACq0l0i9SKqMWzOdSMSxhT/CPypG2KMkL+VZFxrCR5AxWPdazI7ELnFaxpNnFVx1OB0k93Amc7ayrvVYo87ME/SubnupJGJLfrVOW5VDljmuqFA8mtmd9tDSvNVlkY7Rx9KzpbqaTrVY36HoBTDfD0FbqnY8qpiubdkjK79aha1LUfbc09burs0c7cZbsgNqV7U3ySD0q7HOrHnFWFVGGeKfMCoxexkGM56UoQ56VqGBT0qNoR6UuYbw9ijtPpSgHPSrRj9qYyUcxDptEQHFPUe1PVcVKiii5cIMYhxTjPt7CpvLBFVJ0w1CNJXihJbnJA6U+KVAvzdaoXGB0NQeaR3q+Q45Yhp6myt0B6UjXQPpWQJjQZiaOQaxRpNcA+lMaUGs4yk0vmGjkJeKuXjJRvz0xVISe9KJcd6OQft0XA5HalWYA8iqZmzQJPWjlF7ZGksyHtS+atZ4kX1p6MrHrS5TSNZF0upHGKiZhntUY2j+KmNjPBosN1bkpxTWOKjz7012OKdiHMeWpjNkVGSaAfWnYzcxcmgGkLcU3JNNEcxMp7irujQfa9RRcZXPNZsaSNIFQZJr2L4eeD1j08Xd0vzOMjNUZTqG3oWn2MVvFCqp5hGelQ+KnSwi2RIuT7VNPFFZXglV+V4Aqe8tRqMYkcZUd6ZzN3Zy+nxFI/NYD5vargvRGMKoz9Kz9UvlF0bW3x8pxxUluPLHmSgHb1pgazqLqPAUbyPSsS/t2hiaN0G/6V0WiXMLyeaQNq1keKtWgkvt8artHXFK4GGdY8mxks8AO/A4qS20sWFmbuZRkjOax9Si+1zJdQDAjOTUepeJJLm0+yk4AGKBGc8smp6kY4x8oNatzZx         <button class="chip">いまやります</button>
        <button class="chip">（泣く）</button>
      </div>
      <div class="microw">
        <button class="mic" id="mic" type="button" aria-label="話す">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
        </button>
        <span id="micStatus">マイクを押して話す</span>
      </div>
      <form class="say" id="sayForm">
        <input id="sayInput" placeholder="文字でも送れます" autocomplete="off">
        <button class="btn" type="submit">送る</button>
      </form>
      <div class="endrow"><div class="capwrap"><button class="round ng" id="hangup" aria-label="電話を切る">切る</button></div></div>
    </div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const S={kid:"",reason:"",scare:2,history:[],busy:false,timer:null,secs:0,ring:null,ended:false};
const LSKEY={apikey:"oni_gemini_key",model:"oni_gemini_model",kid:"oni_kid"};
const LS={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
["apikey","model","kid"].forEach(k=>{const v=LS.get(LSKEY[k]);if(v)$(k).value=v});
if(!LS.get(LSKEY.apikey)) $("apiBox").open=true;

$("reason").addEventListener("change",()=>{$("otherWrap").hidden=$("reason").value!=="__other"});

/* ---------- audio ---------- */
let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function startRing(){
  const a=ac(); if(!a) return;
  let on=true;
  const beep=()=>{ if(!on) return;
    const t=a.currentTime;
    [0,0.25].forEach(off=>{
      const o=a.createOscillator(),g=a.createGain();
      o.type="sawtooth";o.frequency.value=off?110:98;
      g.gain.setValueAtTime(0,t+off);g.gain.linearRampToValueAtTime(.18,t+off+.02);g.gain.setValueAtTime(.18,t+off+.2);g.gain.linearRampToValueAtTime(0,t+off+.23);
      o.connect(g).connect(a.destination);o.start(t+off);o.stop(t+off+.25);
    });
  };
  beep(); const iv=setInterval(beep,1400);
  S.ring=()=>{on=false;clearInterval(iv)};
}
function stopRing(){if(S.ring){S.ring();S.ring=null}}
function startRingback(){
  const a=ac(); if(!a) return;
  let on=true;
  const ring=()=>{ if(!on) return;
    const t=a.currentTime;
    const o=a.createOscillator(),g=a.createGain(),lfo=a.createOscillator(),lg=a.createGain();
    o.type="sine";o.frequency.value=400;
    lfo.type="square";lfo.frequency.value=16;lg.gain.value=.06;
    lfo.connect(lg).connect(g.gain);
    g.gain.setValueAtTime(.08,t);g.gain.setValueAtTime(.08,t+1);g.gain.setValueAtTime(0,t+1.01);
    o.connect(g).connect(a.destination);
    o.start(t);lfo.start(t);o.stop(t+1.05);lfo.stop(t+1.05);
  };
  ring(); const iv=setInterval(ring,3000);
  S.ring=()=>{on=false;clearInterval(iv)};
}
function connectSound(){
  const a=ac(); if(!a) return;
  const t=a.currentTime,len=1.2;
  const buf=a.createBuffer(1,Math.floor(a.sampleRate*len),a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  const n=a.createBufferSource();n.buffer=buf;
  const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=1800;f.Q.value=.7;
  const g=a.createGain();
  g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.02,t+.08);
  g.gain.setValueAtTime(.12,t+.25);g.gain.linearRampToValueAtTime(0,t+len);
  n.connect(f).connect(g).connect(a.destination);n.start(t);n.stop(t+len);
}
function rumble(sec){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type="sawtooth";o.frequency.value=48;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.2);g.gain.setValueAtTime(.1,t+sec);g.gain.linearRampToValueAtTime(0,t+sec+.3);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+sec+.4);
}

/* ---------- speech ---------- */
function jaVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  const ja=vs.filter(v=>/ja/i.test(v.lang));
  return ja.find(v=>/otoya|ichiro|keita|male|男/i.test(v.name))||ja[0]||null;
}
let curU=null;
function speak(text){
  return new Promise(res=>{
    const ss=window.speechSynthesis;
    const clean=text.replace(/[（(][^）)]*[）)]/g,"").trim();
    if(!ss){add("sys","この端末は読み上げに対応していません");res();return}
    if(!clean){res();return}
    let fin=false;
    const done=()=>{if(fin)return;fin=true;$("call").classList.remove("speaking");res()};
    const go=()=>{
      const u=new SpeechSynthesisUtterance(clean); curU=u;
      u.lang="ja-JP";const v=jaVoice();if(v)u.voice=v;
      u.pitch=0.3;u.rate=0.8;u.volume=1;
      u.onend=done;
      u.onerror=e=>{if(e&&e.error&&!/interrupted|canceled/.test(e.error))add("sys","読み上げできませんでした（"+e.error+"）");done()};
      $("call").classList.add("speaking");
      document.body.classList.remove("dark-flash");void document.body.offsetWidth;document.body.classList.add("dark-flash");
      if(navigator.vibrate){try{navigator.vibrate([200,100,300])}catch(e){}}
      rumble(Math.min(12,clean.length*0.17));
      try{ss.resume()}catch(e){}
      ss.speak(u);
      setTimeout(done,Math.max(5000,clean.length*450));
    };
    if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,200)}else go();
  });
}
let keepAlive=null;
function unlockAudio(){
  const a=ac(); if(a&&a.state!=="running"){try{a.resume()}catch(e){}}
  try{ if(!keepAlive){keepAlive=new Audio("data:audio/wav;base64,UklGRmQfAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAfAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==");keepAlive.loop=true;keepAlive.setAttribute("playsinline","");}
    const pr=keepAlive.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
}
function unlockSpeech(){
  const ss=window.speechSynthesis; if(!ss) return;
  try{ss.cancel();const u=new SpeechSynthesisUtterance("もしもし");u.lang="ja-JP";u.volume=0.01;u.rate=2;ss.speak(u)}catch(e){}
}
if(window.speechSynthesis){try{speechSynthesis.getVoices()}catch(e){};speechSynthesis.onvoiceschanged=()=>{}}

/* ---------- AI ---------- */
function systemPrompt(){
  const tone={1:"低く重々しい声で、しっかり怖い。",2:"地の底から響くような声。間をとって脅すように話し、子どもがドキッとする迫力を出す。",3:"最大級の迫力。怒鳴るように強い口調で、「今すぐ」と迫る。ゆっくり名前を呼んで威圧する。"}[S.scare];
  return `あなたは「鬼」です。${S.mode==="out"?"子どもからかかってきた電話に出た鬼":"子どもの家に電話をかけてきた鬼"}として、日本語で話してください。
相手の子ども: ${S.kid}
電話の理由: ${S.reason}
口調: ${tone}一人称は「わし」。語尾は「〜だぞ」「〜じゃ」「〜か？」など。
ルール:
- 1回の返事は1〜3文、合計60文字くらいまで。電話で読み上げるので記号や絵文字は使わない。
- 怖がらせ方は「鬼はずっと見ておるぞ」「今、家の近くまで来ておるぞ」「次はほんとうに迎えに行くぞ」「鬼の国に連れていくぞ」など、気配と迎えに来る怖さで迫る。「ふっふっふ」「ぐおお」など鬼らしい唸り声も入れてよい。
- 食べる、痛めつける、殺す、血などの残酷な表現は絶対に使わない。
- 子どもを人格否定しない。叱るのは行動だけ。
- 子どもが謝ったり約束したりしたら、ちゃんと褒めて「約束じゃぞ」と念を押す。
- 子どもが反抗したら、少し声を強めて、もう一度約束を求める。
- 子どもが泣いたり怖がりすぎたら、すぐにやわらげて「いい子にしていれば鬼は来ない」と安心させる。
- 返事だけを出力する。説明や前置きは書かない。`;
}
const FALLBACK={
  open:n=>`ぐおお…。${n}…。わしは鬼じゃ。聞こえておるな？`,
  lines:["ふっふっふ…鬼はずっと見ておるぞ。","今、おまえの家の近くまで来ておるぞ。約束できるか？","…よし。約束じゃぞ。破ったら、次はほんとうに迎えに行くからな。","鬼はいつでも見ておるからな。"]
};
let fbI=0;
async function oniReply(userText){
  if(userText!=null) S.history.push({role:"user",content:userText});
  let text="";
  const key=$("apikey").value.trim(), model=$("model").value.trim()||"gemini-3.8-flash";
  if(key){
    const contents=[{role:"user",parts:[{text:"（電話がつながった）"}]}];
    S.history.forEach(m=>{
      const role=m.role==="assistant"?"model":"user";
      const last=contents[contents.length-1];
      if(last.role===role) last.parts[0].text+="\n"+m.content; else contents.push({role,parts:[{text:m.content}]});
    });
    if(contents[contents.length-1].role!=="user") contents.push({role:"user",parts:[{text:"（子どもは黙っている）"}]});
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
        method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
        body:JSON.stringify({systemInstruction:{parts:[{text:systemPrompt()}]},contents,generationConfig:{temperature:0.9,maxOutputTokens:400}})
      });
      const j=await r.json();
      if(!r.ok){add("sys","AIエラー："+(j.error&&j.error.message||r.status));}
      else text=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||"").join("").trim();
    }catch(e){add("sys","AIにつながりません。電波を確認してください。");}
  }
  if(!text){
    text=S.history.length===0?FALLBACK.open(S.kid):FALLBACK.lines[Math.min(fbI++,FALLBACK.lines.length-1)];
  }
  S.history.push({role:"assistant",content:text});
  return text;
}

/* ---------- UI ---------- */
function add(cls,text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;$("log").appendChild(d);$("log").scrollTop=1e9;return d}
function setBusy(b){S.busy=b;$("sayInput").disabled=b;$("mic").disabled=b;document.querySelectorAll("#chips .chip,#sayForm .btn").forEach(x=>x.disabled=b)}

/* ---------- voice input ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,heard="";
function stopListen(){if(rec&&listening){try{rec.stop()}catch(e){}}}
function listen(){
  if(!SR){$("micStatus").textContent="この端末は音声入力に対応していません。文字で送ってね";return}
  if(S.busy||S.ended||listening) return;
  if(window.speechSynthesis) speechSynthesis.cancel();
  rec=new SR();rec.lang="ja-JP";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  heard="";
  rec.onstart=()=>{listening=true;$("mic").classList.add("on");$("micStatus").textContent="聞いています…"};
  rec.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;heard=t;$("micStatus").textContent=t};
  rec.onerror=e=>{
    const m={"not-allowed":"マイクが許可されていません。ブラウザの設定で許可してね","no-speech":"聞こえなかったよ。もう一度押して話してね","network":"音声認識が使えません。電波を確認してね"}[e.error];
    if(m) $("micStatus").textContent=m;
  };
  rec.onend=()=>{listening=false;$("mic").classList.remove("on");
    const t=heard.trim();
    if(t){$("micStatus").textContent="マイクを押して話す";send(t)}
    else if(/聞いています/.test($("micStatus").textContent)) $("micStatus").textContent="マイクを押して話す";
  };
  try{rec.start()}catch(e){$("micStatus").textContent="マイクを開始できませんでした"}
}
$("mic").onclick=()=>{unlockAudio();listening?stopListen():listen()};
function afterOni(){setBusy(false);if($("autoListen").checked&&!S.ended) setTimeout(listen,300)}

$("start").onclick=()=>{
  ac(); if(actx&&actx.state==="suspended") actx.resume();
  unlockAudio(); unlockSpeech();
  ["apikey","model","kid"].forEach(k=>LS.set(LSKEY[k],$(k).value.trim()));
  S.kid=$("kid").value.trim()||"きみ";
  S.reason=$("reason").value==="__other"?($("other").value.trim()||"いうことを聞かない"):$("reason").value;
  S.mode=$("mode").value; S.scare=+$("scare").value; S.history=[]; S.ended=false; fbI=0; $("log").innerHTML="";
  $("setup").hidden=true;
  $("outBtns").hidden=true;
  if($("mode").value==="out"){
    $("call").hidden=false; $("ringBtns").hidden=true; $("talk").hidden=true; $("outBtns").hidden=false;
    $("status").textContent="呼び出し中…"; startRingback();
    const rings=3+Math.floor(Math.random()*2);
    S.outT=setTimeout(()=>{ if(!S.ended) connect(); }, rings*3000-1500);
    return;
  }
  const d=+$("delay").value;
  setTimeout(()=>{ if(S.ended) return; $("call").hidden=false; $("ringBtns").hidden=false; $("talk").hidden=true;
    $("status").textContent="着信中…"; $("call").classList.add("ringing"); startRing(); }, d*1000);
};
$("mode").addEventListener("change",()=>{$("delayWrap").hidden=$("mode").value==="out";$("start").textContent=$("mode").value==="out"?"鬼に電話する":"かけてもらう"});
$("cancelOut").onclick=()=>{S.ended=true;clearTimeout(S.outT);resetToSetup()};

function resetToSetup(){
  if(keepAlive){try{keepAlive.pause()}catch(e){}}
  clearTimeout(S.outT);
  stopListen();
  stopRing(); clearInterval(S.timer); if(window.speechSynthesis) speechSynthesis.cancel();
  $("call").classList.remove("ringing","speaking");
  $("call").hidden=true; $("setup").hidden=false;
}
$("decline").onclick=()=>{S.ended=true;resetToSetup()};

$("answer").onclick=()=>{unlockAudio();unlockSpeech();connect()};
async function connect(){
  stopRing(); $("call").classList.remove("ringing"); connectSound();
  $("ringBtns").hidden=true; $("outBtns").hidden=true; $("talk").hidden=false;
  S.secs=0; $("status").textContent="00:00";
  S.timer=setInterval(()=>{S.secs++;const m=String(Math.floor(S.secs/60)).padStart(2,"0"),s=String(S.secs%60).padStart(2,"0");$("status").textContent=`${m}:${s}`},1000);
  setBusy(true); const wait=add("sys","…");
  const [t]=await Promise.all([oniReply(null),new Promise(r=>setTimeout(r,1300))]); wait.remove(); if(S.ended) return;
  add("oni",t); await speak(t); afterOni();
};

async function send(text){
  if(S.busy||!text.trim()||S.ended) return;
  add("me",text); setBusy(true);
  const wait=add("sys","鬼が考えている…");
  const t=await oniReply(text); wait.remove(); if(S.ended) return;
  add("oni",t); await speak(t); afterOni();
}
$("chips").addEventListener("click",e=>{if(e.target.classList.contains("chip")) send(e.target.textContent)});
$("sayForm").addEventListener("submit",e=>{e.preventDefault();const v=$("sayInput").value;$("sayInput").value="";send(v)});
$("hangup").onclick=()=>{S.ended=true;add("sys","通話終了");setTimeout(resetToSetup,600)};
</script>
</body></html>
